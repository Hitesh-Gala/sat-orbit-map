<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NAZAR · Debris Tracker</title>
  <link rel="preconnect" href="https://celestrak.org">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=42">
  <style>
    /* Left filter/legend card, same idiom as the Sats-by-Operator page. */
    .debris-shell {
      position: fixed; top: 86px; left: 14px; width: 300px;
      max-width: calc(100vw - 28px); max-height: calc(100vh - 100px);
      overflow-y: auto; z-index: 10; display: flex; flex-direction: column; gap: 8px;
    }
    .deb-controls { display: flex; gap: 6px; margin-bottom: 8px; }
    .deb-controls button {
      flex: 1; background: rgba(103, 200, 255, 0.10); border: 1px solid var(--line);
      border-radius: 3px; color: var(--accent); font-family: var(--mono); font-size: 12.5px;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 8px; cursor: pointer;
    }
    .deb-controls button:hover { background: rgba(103, 200, 255, 0.22); border-color: var(--accent); }
    .deb-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 2px;
      font-family: var(--mono); font-size: 14px;
      border-bottom: 1px solid rgba(110, 200, 255, 0.05);
    }
    .deb-row:last-child { border-bottom: 0; }
    .deb-row input[type="checkbox"] { flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
    .deb-row .swatch { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
    .deb-lbl { flex: 1; min-width: 0; color: var(--text); }
    .deb-country { color: var(--dim); font-size: 12px; letter-spacing: 0.04em; }
    .deb-cnt { flex: 0 0 auto; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13.5px; min-width: 44px; text-align: right; }
    .deb-slider { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 4px; font-size: 13.5px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
    .deb-slider .slider-row { display: flex; justify-content: space-between; align-items: baseline; }
    .deb-slider .slider-value { color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; text-transform: none; }
    .deb-slider input[type="range"] { width: 100%; accent-color: var(--accent); }
    .debris-status { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
    .deb-stats-btn {
      width: 100%; padding: 9px; border-radius: 5px; background: rgba(103, 200, 255, 0.14);
      border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono);
      font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .deb-stats-btn:hover { background: rgba(103, 200, 255, 0.26); transform: translateY(-1px); }
    .deb-hint { font-size: 13px; color: var(--dim); line-height: 1.5; }

    /* ⓘ info button on each filter row + the "gaps" button */
    .deb-info {
      flex: 0 0 auto; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
      background: none; border: 0; padding: 0; margin-left: 2px; cursor: pointer;
      color: var(--dim); font-size: 14px; border-radius: 50%;
    }
    .deb-info:hover { color: var(--accent); background: rgba(103, 200, 255, 0.14); }
    .deb-gaps-btn {
      width: 100%; margin-top: 8px; padding: 7px 9px; border-radius: 5px;
      background: rgba(255, 210, 127, 0.08); border: 1px solid rgba(255, 210, 127, 0.4);
      color: #ffd27f; font-family: var(--mono); font-size: 11px; cursor: pointer; text-align: left; line-height: 1.4;
    }
    .deb-gaps-btn:hover { background: rgba(255, 210, 127, 0.16); }

    /* Info pop-up (story / facts / trivia) */
    .deb-modal {
      position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
      padding: 22px; background: rgba(4, 8, 14, 0.74); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .deb-modal[hidden] { display: none; }
    .deb-modal-card {
      position: relative; width: min(620px, 96vw); max-height: min(90vh, 780px); overflow-y: auto;
      background: #070d14; border: 1px solid #1d3147; border-radius: 12px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6); padding: 20px 22px 22px;
    }
    .deb-modal-close {
      position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
      background: #10203a; color: #cfe0f2; border: 1px solid #1d3147; font-size: 18px; line-height: 1;
    }
    .deb-modal-close:hover { background: #1b3559; border-color: #4ea8ff; }
    .deb-info-head { display: flex; align-items: flex-start; gap: 12px; padding-right: 34px; margin-bottom: 12px; }
    .deb-info-head .swatch { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 5px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
    .deb-info-head h2 { margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.02em; color: #e6f0fb; line-height: 1.25; }
    .deb-info-sub { font-family: var(--mono); font-size: 12px; color: #8aa0b8; margin-top: 4px; }
    .deb-info-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 4px 0 14px; }
    .deb-info-stat { background: rgba(103, 200, 255, 0.06); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
    .deb-info-stat .k { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
    .deb-info-stat .v { display: block; margin-top: 3px; font-family: var(--mono); font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .deb-info-p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.6; color: var(--text); }
    .deb-info-p em { color: #ffd27f; font-style: normal; }
    .deb-info-trivia { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .deb-info-trivia .k { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .deb-info-trivia ul { margin: 8px 0 0; padding-left: 18px; }
    .deb-info-trivia li { font-size: 12.5px; line-height: 1.5; color: var(--dim); margin-bottom: 6px; }
  </style>
</head>
<body class="page-debris">
  <a class="top-logo" href="index.html" title="NAZAR — back to the live globe">
    <img src="data/nazar-logo.svg?v=5" alt="NAZAR">
  </a>

  <div id="globe"></div>

  <a class="top-nazar-btn" href="index.html" title="Back to the NAZAR main view">
    <span class="ico">◯</span>
    <span class="lbl">NAZAR</span>
  </a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-short">NAZAR</span>
      <span class="brand-long"> · Debris Tracker</span>
    </div>
    <div class="sub">Tracked fragments from the major on-orbit breakup events, at true altitude.</div>
  </header>

  <aside class="debris-shell" aria-label="Debris filter">
    <section class="panel">
      <div class="label" style="margin-bottom: 6px">Breakup event</div>
      <div class="deb-controls">
        <button type="button" id="deb-all">Show All</button>
        <button type="button" id="deb-none">Hide All</button>
      </div>
      <div id="debris-sources"></div>
    </section>

    <section class="panel">
      <div class="label" style="margin-bottom: 6px">View options</div>
      <div class="deb-slider">
        <div class="slider-row"><span>Altitude scale</span><span class="slider-value"><span id="deb-alt-val">1.0</span>×</span></div>
        <input type="range" id="deb-alt" min="0.2" max="3" step="0.1" value="1">
      </div>
      <div class="deb-slider">
        <div class="slider-row"><span>Dot size</span><span class="slider-value"><span id="deb-size-val">1.0</span>×</span></div>
        <input type="range" id="deb-size" min="0.3" max="3" step="0.1" value="1">
      </div>
    </section>

    <section class="panel">
      <a href="debris-stats.html" class="deb-stats-btn" style="display:block;text-align:center;text-decoration:none" title="Full cumulative history, country breakdown and charts from the whole SATCAT">📊 Statistics &amp; history</a>
      <button type="button" id="debris-gaps-btn" class="deb-gaps-btn">ⓘ Why aren't US / India ASAT debris shown?</button>
      <div id="debris-status" class="debris-status" style="margin-top:8px">Booting…</div>
      <div class="deb-hint" style="margin-top:8px">Hover any fragment for its details. Tap ⓘ on any event for its story.</div>
    </section>
  </aside>

  <div id="sat-tip" class="sat-tip-3d" hidden></div>

  <!-- Info pop-up — story/facts/trivia for a debris class (opened by the ⓘ
       buttons in the filter panel).  Body filled by debris.js renderInfo(). -->
  <div id="debris-info-modal" class="deb-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="debris-info-title">
    <div class="deb-modal-card">
      <button type="button" id="debris-info-close" class="deb-modal-close" aria-label="Close">×</button>
      <div id="debris-info-body"><!-- filled at runtime --></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="tle-loader.js?v=11"></script>
  <script src="debris.js?v=3"></script>
  <script src="nazar-bgm.js?v=4"></script>
  <script src="mobile-menu.js?v=13"></script>
</body>
</html>
