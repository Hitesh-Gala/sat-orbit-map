<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NAZAR · Sats by Operator</title>
  <link rel="preconnect" href="https://celestrak.org">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=43">
  <style>
    /* Page-specific HUD — taller than the viz3d panel because the
       category list runs to ~30 rows.  Same visual idiom otherwise. */
    .sbo-shell {
      position: fixed;
      top: 86px;
      left: 14px;
      width: 344px;
      max-width: calc(100vw - 28px);
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sbo-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .sbo-controls button {
      flex: 1;
      background: rgba(103, 200, 255, 0.10);
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 8px;
      cursor: pointer;
    }
    .sbo-controls button:hover {
      background: rgba(103, 200, 255, 0.22);
      border-color: var(--accent);
    }
    .sbo-tier {
      margin-top: 10px;
      padding-bottom: 4px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 500;
      font-size: 12.5px;
      letter-spacing: 0.18em;
      color: var(--dim);
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }
    .sbo-tier:first-child { margin-top: 4px; }
    .sbo-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 2px;
      cursor: default;
      user-select: none;
      font-family: var(--mono);
      font-size: 14px;
      border-bottom: 1px solid rgba(110, 200, 255, 0.05);
    }
    .sbo-row:hover { background: rgba(103, 200, 255, 0.05); }
    .sbo-row input[type="checkbox"] {
      flex: 0 0 auto;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .sbo-row .swatch {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 6px currentColor;
    }
    /* Operator name is now a button that opens the dossier pop-up. */
    .sbo-row .lbl {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      text-decoration: underline dotted transparent;
      text-underline-offset: 2px;
    }
    .sbo-row .lbl:hover { color: var(--accent); text-decoration-color: var(--accent); }
    .sbo-row .cnt {
      flex: 0 0 auto;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-size: 13.5px;
      min-width: 42px;
      text-align: right;
    }
    .sbo-row.zero .cnt { color: var(--dim); }
    /* ⓘ info button — opens the same pop-up as the name. */
    .sbo-row .sbo-info {
      flex: 0 0 auto;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: 0; padding: 0;
      color: var(--dim); font-size: 13px; cursor: pointer;
      border-radius: 50%;
    }
    .sbo-row .sbo-info:hover { color: var(--accent); background: rgba(103, 200, 255, 0.14); }
    /* When the user hovers a category row, the row itself gets a tinted
       background so it's obvious which group is currently blinking on
       the globe.  JS adds .highlight via mouseenter/mouseleave. */
    .sbo-row.highlight {
      background: rgba(103, 200, 255, 0.18);
      border-bottom-color: var(--accent);
    }
    .sbo-status { font-size: 13.5px; color: var(--dim); line-height: 1.5; }
    .sbo-status strong { color: var(--accent); font-weight: normal; font-variant-numeric: tabular-nums; }

    /* Altitude / size sliders — same idiom as the viz3d page. */
    .sbo-slider {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 6px 0 4px;
      font-size: 13.5px;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sbo-slider .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .sbo-slider .slider-value {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      text-transform: none;
    }
    .sbo-slider input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    /* ---- Operator dossier pop-up ---- */
    .sbo-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 22px;
      background: rgba(4, 8, 14, 0.72);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .sbo-modal[hidden] { display: none; }
    .sbo-modal-card {
      position: relative;
      width: min(560px, 96vw); max-height: min(88vh, 760px);
      overflow-y: auto;
      background: #070d14; border: 1px solid #1d3147; border-radius: 12px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      padding: 20px 22px 18px;
    }
    .sbo-modal-close {
      position: absolute; top: 12px; right: 12px;
      width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
      background: #10203a; color: #cfe0f2; border: 1px solid #1d3147;
      font-size: 18px; line-height: 1;
      transition: background .15s, border-color .15s;
    }
    .sbo-modal-close:hover { background: #1b3559; border-color: #4ea8ff; }
    .sbo-modal-head { display: flex; align-items: flex-start; gap: 12px; padding-right: 34px; }
    .sbo-modal-dot {
      flex: 0 0 auto; width: 16px; height: 16px; margin-top: 5px;
      border-radius: 50%; box-shadow: 0 0 10px currentColor;
    }
    .sbo-modal-titles h2 {
      margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 700;
      font-size: 17px; letter-spacing: 0.02em; color: #e6f0fb; line-height: 1.2;
    }
    .sbo-modal-sub { font-family: var(--mono); font-size: 12px; color: #8aa0b8; margin-top: 4px; }
    .sbo-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 16px 0 6px;
    }
    .sbo-stat {
      background: rgba(103, 200, 255, 0.06); border: 1px solid var(--line);
      border-radius: 7px; padding: 8px 10px;
    }
    .sbo-stat.hl { border-color: rgba(103, 200, 255, 0.4); background: rgba(103, 200, 255, 0.12); }
    .sbo-stat .k { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
    .sbo-stat .v { display: block; margin-top: 3px; font-family: var(--mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
    .sbo-desc { margin: 12px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--text); }
    .sbo-field { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--text); }
    .sbo-field .k, .sbo-note .k {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent); display: inline-block; margin-right: 4px;
    }
    .sbo-note {
      margin: 14px 0 0; padding: 11px 13px; font-size: 13px; line-height: 1.55; color: var(--text);
      background: rgba(255, 210, 127, 0.08); border-left: 3px solid #ffd27f; border-radius: 6px;
    }
    .sbo-note .k { color: #ffd27f; display: block; margin-bottom: 3px; }
    .sbo-foot { margin: 16px 0 0; font-size: 11px; line-height: 1.5; color: var(--dim); font-style: italic; }

    /* Company-history timeline */
    .sbo-history { margin: 14px 0 0; }
    .sbo-history > .k {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 8px;
    }
    .sbo-timeline { list-style: none; margin: 0; padding: 0 0 0 2px; border-left: 1px solid var(--line); }
    .sbo-timeline li {
      position: relative; padding: 0 0 9px 15px;
      font-size: 12.5px; line-height: 1.45; color: var(--text);
    }
    .sbo-timeline li:last-child { padding-bottom: 0; }
    .sbo-timeline li::before {
      content: ''; position: absolute; left: -4px; top: 5px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
    }
    .sbo-timeline .yr {
      font-family: var(--mono); color: var(--accent); font-variant-numeric: tabular-nums;
      margin-right: 8px; white-space: nowrap;
    }
  </style>
</head>
<body class="page-sbo">
  <a class="top-logo" href="index.html" title="NAZAR — back to the live globe">
    <img src="data/nazar-logo.svg?v=5" alt="NAZAR">
  </a>

  <div id="globe"></div>

  <!-- Prominent NAZAR back-button anchored top-left.  Replaces the
       old single-item .left-nav so the link is unmistakable as the
       navigation home rather than another data-viz launcher. -->
  <a class="top-nazar-btn" href="index.html" title="Back to the NAZAR main view">
    <span class="ico">◯</span>
    <span class="lbl">NAZAR</span>
  </a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-short">NAZAR</span>
      <span class="brand-long"> · Sats by Operator</span>
    </div>
    <div class="sub">Live catalogue, colour-coded by operator / constellation / mission family.</div>
  </header>

  <aside class="sbo-shell" aria-label="Operator filter">
    <section class="panel">
      <div class="label" style="margin-bottom: 6px">Filter by category</div>
      <div class="sbo-controls">
        <button type="button" id="sbo-all">Show All</button>
        <button type="button" id="sbo-none">Hide All</button>
      </div>
      <!-- Category list, populated at runtime by sats-by-ops.js.  One row
           per category, grouped under tier headings (GNSS / Constellations
           / Earth Obs / Communications / Meteorology / ISR / Other). -->
      <div id="sbo-categories"></div>
    </section>

    <!-- View options: altitude exaggeration + sat size, same idiom as
         the 3-D Visualiser page. -->
    <section class="panel">
      <div class="label" style="margin-bottom: 6px">View options</div>
      <div class="sbo-slider">
        <div class="slider-row">
          <span>Altitude scale</span>
          <span class="slider-value"><span id="sbo-alt-val">1.0</span>×</span>
        </div>
        <input type="range" id="sbo-alt" min="0.2" max="3" step="0.1" value="1">
      </div>
      <div class="sbo-slider">
        <div class="slider-row">
          <span>Sat size</span>
          <span class="slider-value"><span id="sbo-size-val">1.0</span>×</span>
        </div>
        <input type="range" id="sbo-size" min="0.3" max="3" step="0.1" value="1">
      </div>
    </section>

    <section class="panel">
      <div id="sbo-status" class="sbo-status">Booting…</div>
    </section>
  </aside>

  <!-- Hover-tooltip element — re-uses the .sat-tip-3d styling that viz3d
       already ships in styles.css.  Populated by sats-by-ops.js's
       raycaster. -->
  <div id="sat-tip" class="sat-tip-3d" hidden></div>

  <!-- Operator dossier pop-up — opened by clicking a company name or its
       ⓘ button in the category list.  Populated by sats-by-ops.js. -->
  <div id="sbo-modal" class="sbo-modal" hidden aria-hidden="true"
       role="dialog" aria-modal="true" aria-labelledby="sbo-modal-title">
    <div class="sbo-modal-card">
      <button type="button" id="sbo-modal-close" class="sbo-modal-close" aria-label="Close">×</button>
      <div id="sbo-modal-body"><!-- filled at runtime --></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="tle-loader.js?v=11"></script>
  <script src="sats-by-ops.js?v=7"></script>
  <script src="nazar-bgm.js?v=4"></script>
  <script src="site-analytics.js?v=1"></script>
  <script src="mobile-menu.js?v=19"></script>
</body>
</html>
