<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 84" fill="none" role="img" aria-label="NAZAR">
  <defs>
    <radialGradient id="nz-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff7d6" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffd86b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nz-beam" x1="33" y1="29" x2="126" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffe08a" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="nz-tower" x1="20" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdd9e6"/>
    </linearGradient>
  </defs>

  <!-- stars -->
  <g fill="#8fa8bd">
    <circle cx="58" cy="8"  r="1"/>
    <circle cx="76" cy="5"  r="1.2"/>
    <circle cx="112" cy="46" r="1"/>
    <circle cx="120" cy="62" r="1.3"/>
    <circle cx="48" cy="30" r="0.9"/>
    <circle cx="14" cy="20" r="1"/>
  </g>

  <!-- light beam (lantern -> satellite) -->
  <path d="M33 26 L126 4 L126 32 L33 32 Z" fill="url(#nz-beam)"/>

  <!-- lantern halo -->
  <circle cx="30" cy="29" r="11" fill="url(#nz-glow)"/>

  <!-- rocky base -->
  <path d="M9 76 Q18 68 30 69 Q44 70 51 76 L51 80 L9 80 Z" fill="#26384a"/>

  <!-- tower -->
  <path d="M20 74 L40 74 L34 38 L26 38 Z" fill="url(#nz-tower)"/>
  <!-- red bands -->
  <path d="M22.3 60 L37.7 60 L39 68 L21 68 Z" fill="#ff6b6b"/>
  <path d="M24.7 46 L35.3 46 L36.3 52 L23.7 52 Z" fill="#ff6b6b"/>

  <!-- gallery platform -->
  <rect x="23.5" y="34" width="13" height="4.5" rx="1" fill="#b9c7d6"/>

  <!-- lantern room (the light) -->
  <rect x="26.5" y="24" width="7" height="10.5" rx="1" fill="#fff3c4"/>
  <rect x="26.5" y="24" width="7" height="10.5" rx="1" fill="none" stroke="#ffce5a" stroke-width="0.8"/>
  <!-- roof + finial -->
  <path d="M25.5 24 L34.5 24 L32 19.5 L28 19.5 Z" fill="#2b3b4d"/>
  <circle cx="30" cy="18" r="1.4" fill="#ffd166"/>

  <!-- satellite -->
  <g>
    <!-- soft illuminated halo -->
    <circle cx="92" cy="19" r="14" fill="#ffe08a" opacity="0.10"/>
    <!-- solar panels -->
    <g fill="#2f6fc0" stroke="#67c8ff" stroke-width="0.8">
      <rect x="68" y="14.5" width="16" height="9" rx="0.8"/>
      <rect x="100" y="14.5" width="16" height="9" rx="0.8"/>
    </g>
    <g stroke="#1e4e90" stroke-width="0.7">
      <line x1="73.3" y1="14.5" x2="73.3" y2="23.5"/>
      <line x1="78.6" y1="14.5" x2="78.6" y2="23.5"/>
      <line x1="105.3" y1="14.5" x2="105.3" y2="23.5"/>
      <line x1="110.6" y1="14.5" x2="110.6" y2="23.5"/>
      <line x1="68" y1="19" x2="84" y2="19"/>
      <line x1="100" y1="19" x2="116" y2="19"/>
    </g>
    <!-- struts -->
    <g stroke="#9fb6c9" stroke-width="1">
      <line x1="84" y1="19" x2="86.5" y2="19"/>
      <line x1="97.5" y1="19" x2="100" y2="19"/>
    </g>
    <!-- body -->
    <rect x="86.5" y="13" width="11" height="12" rx="2" fill="#dbeefb" stroke="#67c8ff" stroke-width="1"/>
    <!-- antenna / dish -->
    <line x1="92" y1="13" x2="92" y2="8.5" stroke="#cfe8ff" stroke-width="1"/>
    <circle cx="92" cy="7.5" r="1.6" fill="#cfe8ff"/>
  </g>
</svg>
