<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NAZAR · ChinRepo</title>
  <link rel="preconnect" href="https://celestrak.org">
  <link rel="stylesheet" href="styles.css?v=43">
  <style>
    /* ---- red, clickable "Site" column header + row cells ---- */
    .site-map-btn {
      background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
      color: #ff4d3d; font-weight: 700; letter-spacing: inherit; text-transform: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .site-map-btn:hover { color: #ff7a6d; text-decoration: underline; }
    .th-site { white-space: nowrap; }
    .site-cell {
      background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
      color: #ff5a4d; font-variant-numeric: tabular-nums;
    }
    .site-cell:hover { color: #ff8b7d; text-decoration: underline; }
    body.light .site-map-btn { color: #d02b1f; }
    body.light .site-map-btn:hover { color: #e0453a; }
    body.light .site-cell { color: #c62f24; }

    /* ============ Launch-sites map modal ============ */
    .lsm-modal {
      position: fixed; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center;
      padding: 3vh 16px; background: rgba(3,6,11,0.86); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .lsm-modal[hidden] { display: none; }
    .lsm-card {
      display: flex; flex-direction: column; width: min(1120px, 97vw); max-height: 94vh; overflow: hidden;
      background: #070c13; border: 1px solid #24384f; border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,0.75);
      color: #d6e2f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .lsm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1a2a3c; }
    .lsm-title { margin: 0; font-family: 'Orbitron', 'Segoe UI', sans-serif; font-size: 16px; letter-spacing: .02em; color: #eaf2fb; }
    .lsm-title small { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #ff7a6d; letter-spacing: .04em; margin-top: 3px; font-weight: 400; }
    .lsm-close { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 7px; cursor: pointer; background: #10203a; color: #cfe0f2; border: 1px solid #24384f; font-size: 18px; line-height: 1; }
    .lsm-close:hover { background: #1b3559; border-color: #4ea8ff; }

    .lsm-tabs { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; }
    .lsm-tab {
      background: rgba(103,200,255,0.06); border: 1px solid #24384f; border-bottom: 0;
      border-radius: 8px 8px 0 0; color: #9fb2c6; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      letter-spacing: .03em; padding: 8px 14px; cursor: pointer;
    }
    .lsm-tab:hover { color: #d6e2f0; background: rgba(103,200,255,0.12); }
    .lsm-tab.active { color: #eaf2fb; background: #0d1826; border-color: #35506f; box-shadow: inset 0 2px 0 #ff5a4d; }
    .lsm-tabhint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7d93ab; padding: 0 16px 8px; margin-top: 6px; }

    .lsm-body { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 0; min-height: 0; flex: 1; overflow: hidden; }
    .lsm-stage { position: relative; background: #050a11; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .lsm-mapwrap { position: relative; width: 100%; line-height: 0; }
    .lsm-base { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .lsm-overlay { position: absolute; inset: 0; }

    /* markers */
    .lsm-marker { position: absolute; transform: translate(-50%, -50%); cursor: pointer; z-index: 2; }
    .lsm-marker .dot {
      width: 13px; height: 13px; border-radius: 50%; background: #ff4d3d; border: 2px solid #fff;
      box-shadow: 0 0 0 2px rgba(255,77,61,0.4), 0 1px 4px rgba(0,0,0,0.6); transition: transform .12s;
    }
    .lsm-marker.poi .dot { width: 11px; height: 11px; background: #67c8ff; border-radius: 2px; box-shadow: 0 0 0 2px rgba(103,200,255,0.4), 0 1px 4px rgba(0,0,0,0.6); }
    .lsm-marker.sea .dot { background: #38d0c0; box-shadow: 0 0 0 2px rgba(56,208,192,0.4), 0 1px 4px rgba(0,0,0,0.6); }
    .lsm-marker .code {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -160%); white-space: nowrap;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; color: #fff;
      text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none;
    }
    .lsm-marker:hover .dot, .lsm-marker.sel .dot { transform: scale(1.35); }
    .lsm-marker.sel .dot { box-shadow: 0 0 0 3px rgba(255,255,255,0.85), 0 0 12px rgba(255,77,61,0.9); }

    /* city labels (political tab) */
    .lsm-city { position: absolute; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; display: flex; align-items: center; gap: 3px; }
    .lsm-city .cdot { width: 4px; height: 4px; border-radius: 50%; background: #33465c; }
    .lsm-city .cname { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #24303e; text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,0.9); white-space: nowrap; }

    /* side panel */
    .lsm-side { border-left: 1px solid #1a2a3c; background: #0a121c; overflow-y: auto; padding: 14px 16px 18px; }
    .lsm-side-empty { color: #7d93ab; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; }
    .lsm-side-empty b { color: #cfe0f2; }
    .lsm-s-code { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: #0b0f14; background: #ff5a4d; padding: 2px 7px; border-radius: 4px; letter-spacing: .05em; }
    .lsm-s-code.poi { background: #67c8ff; } .lsm-s-code.sea { background: #38d0c0; }
    .lsm-s-name { margin: 8px 0 2px; font-family: 'Orbitron', sans-serif; font-size: 16px; color: #fff; line-height: 1.2; }
    .lsm-s-cn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8aa0b8; }
    .lsm-s-meta { display: flex; flex-wrap: wrap; gap: 5px 14px; margin: 9px 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9fb2c6; }
    .lsm-s-meta b { color: #e6f0fb; font-weight: 600; }
    .lsm-s-blurb { font-size: 13px; line-height: 1.62; color: #c3d2e2; margin: 4px 0 12px; }
    .lsm-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lsm-thumb { display: block; width: 100%; border: 0; padding: 0; cursor: pointer; background: none; }
    .lsm-thumb img { display: block; width: 100%; height: 96px; object-fit: cover; border-radius: 7px; border: 1px solid #24384f; }
    .lsm-thumb .tcap { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #7d93ab; line-height: 1.35; margin-top: 4px; text-align: left; }
    .lsm-thumb:hover img { border-color: #4ea8ff; }
    .lsm-nophoto { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #7d93ab; line-height: 1.6; border: 1px dashed #24384f; border-radius: 8px; padding: 10px 12px; }

    /* legend / footer */
    .lsm-foot { border-top: 1px solid #1a2a3c; padding: 9px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8aa0b8; }
    .lsm-foot .lg { display: inline-flex; align-items: center; gap: 6px; }
    .lsm-foot .k { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .lsm-foot .k.sq { border-radius: 2px; }
    .lsm-credit { margin-left: auto; color: #63788f; }
    .lsm-credit a { color: #7d93ab; text-decoration: none; }

    /* lightbox */
    .lsm-lightbox { position: fixed; inset: 0; z-index: 1300; display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; background: rgba(2,5,9,0.92); }
    .lsm-lightbox[hidden] { display: none; }
    .lsm-lightbox figure { margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; }
    .lsm-lightbox img { max-width: 100%; max-height: 82vh; border-radius: 8px; border: 1px solid #24384f; }
    .lsm-lightbox figcaption { margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #b8c8da; text-align: center; max-width: 720px; line-height: 1.5; }
    .lsm-lightbox figcaption a { color: #67c8ff; text-decoration: none; }

    @media (max-width: 760px) {
      .lsm-body { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow-y: auto; }
      .lsm-side { border-left: 0; border-top: 1px solid #1a2a3c; max-height: none; }
      .lsm-marker .code { font-size: 8.5px; }
    }
  </style>
</head>
<body class="page-repo">
  <a class="top-logo" href="index.html" title="NAZAR — back to the live globe">
    <img src="data/nazar-logo.svg?v=5" alt="NAZAR">
  </a>

  <div class="repo-shell">
    <header class="repo-header">
      <div class="brand">NAZAR · CHINREPO · ACTIVE PRC PAYLOADS</div>
      <div class="right">
        <span id="repo-status">Booting…</span>
        <a class="btn-back" href="china-sat-series.html" title="Downloadable field guide to every Chinese satellite series (2025–2026)">⬇ Series Field Guide</a>
        <a class="btn-back" href="compendium.html" title="Open the deep-dive PRC satellite compendium">Chinese Satellite Compendium</a>
        <button type="button" id="theme-toggle" class="btn-back" aria-label="Toggle light / dark mode">☀ Light</button>
        <a class="btn-nazar" href="index.html" title="Back to the NAZAR main view">NAZAR</a>
      </div>
    </header>

    <div class="repo-toolbar">
      <input type="search" id="filter" placeholder="Filter by name or purpose…" autocomplete="off">
      <span class="pill">Showing <strong id="repo-count">…</strong> / <strong id="repo-total">…</strong></span>
      <span class="pill">UTC <strong id="utc-time">--:--:--</strong></span>
      <span class="pill">IST <strong id="ist-time">--:--:--</strong></span>
    </div>

    <div class="repo-table-wrap">
      <table class="repo-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>NORAD</th>
            <th>Int'l ID</th>
            <th>Purpose (inferred)</th>
            <th>Launched</th>
            <th class="th-site"><button type="button" id="site-map-btn" class="site-map-btn" title="Show every launch site on an interactive map of China">Site&nbsp;🛰</button></th>
            <th class="col-num">Altitude</th>
            <th>Sub-point</th>
            <th>Orbit</th>
          </tr>
        </thead>
        <tbody id="repo-rows"></tbody>
      </table>
    </div>
  </div>

  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="tle-loader.js?v=11"></script>
  <script src="chinrepo.js?v=4"></script>
  <script src="launch-sites.js?v=2"></script>
  <script src="nazar-bgm.js?v=4"></script>
  <script src="site-analytics.js?v=1"></script>
  <script src="mobile-menu.js?v=17"></script>
</body>
</html>
