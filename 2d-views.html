<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAZAR · 2-D Views</title>
  <link rel="preconnect" href="https://celestrak.org">
  <link rel="preconnect" href="https://cdn.amcharts.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-2d">
  <header class="site-header">
    <div class="logo-bar">
      <a href="https://takshashila.org.in/" target="_blank" rel="noopener" aria-label="Takshashila Institution">
        <img class="tak-logo" src="assets/takshashila-logo.svg" alt="Takshashila Institution">
      </a>
    </div>
    <div class="brand-banner">
      <div class="brand"><span class="brand-short">NAZAR</span><span class="brand-long">— Nonchalantly Assembled Zero-Budget Assessment of Chinese Reconnaissance</span></div>
      <div class="sub">Kyon ki NAZAR lagni chahiye!</div>
    </div>
    <div class="design-strip" aria-hidden="true"></div>
  </header>
  <div class="page-2d-shell">
    <header class="page-2d-header">
      <div class="brand">2-D VIEWS</div>
      <div class="right">
        <span><span class="legend-dot green"></span>satellite</span>
        <span><span class="legend-dot red"></span>Chinese payload</span>
        <span id="map-status">Booting…</span>
        <a class="btn-back" href="index.html">← Globe</a>
      </div>
    </header>

    <main class="maps-grid maps-single">
      <div class="map-cell">
        <div class="map-title">World · Topographic</div>
        <div class="map-sub">equirectangular · NASA Blue Marble + bathymetry · soft political borders</div>
        <div id="map-equal" class="chart"></div>
      </div>
    </main>
  </div>

  <!-- amCharts 5 -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <!-- Satellite math + shared data layer -->
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="tle-loader.js"></script>
  <script src="2d-views.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
