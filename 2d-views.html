<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Argos · 2-D Views</title>
  <link rel="preconnect" href="https://celestrak.org">
  <link rel="preconnect" href="https://cdn.amcharts.com">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body class="page-2d">
  <a class="top-logo" href="index.html" title="NAZAR — back to the live globe">
    <img src="data/nazar-logo.svg?v=3" alt="NAZAR">
  </a>

  <div class="page-2d-shell">
    <header class="page-2d-header">
      <div class="brand">ARGOS · GROUND TRACK</div>
      <div class="right">
        <span id="map-status">Booting…</span>
        <a class="btn-back" href="index.html">← NAZAR</a>
      </div>
    </header>

    <main class="maps-grid maps-single">
      <div class="map-cell">
        <div id="map-equal" class="chart"></div>

        <div class="track-panel">
          <div class="tp-title">World · Ground Track</div>
          <div class="track-search-wrap">
            <input id="sat-search" type="text" placeholder="Search a satellite…"
                   autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false">
            <div id="sat-results" class="sat-results" role="listbox" hidden></div>
          </div>
          <div id="sat-info" class="sat-info" hidden></div>
          <div class="track-legend">
            <span><i class="lg-line past"></i>past 24 h</span>
            <span><i class="lg-line future"></i>next 24 h</span>
            <span><i class="lg-mark"></i>30-min mark · hover for place</span>
            <span><i class="lg-now"></i>current position</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- amCharts 5 -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <!-- Satellite math + shared data layer -->
  <script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="tle-loader.js?v=8"></script>
  <script src="2d-views.js?v=2"></script>
  <script src="nazar-bgm.js?v=4"></script>
  <script src="mobile-menu.js?v=6"></script>
</body>
</html>
