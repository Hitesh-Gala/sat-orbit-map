<!doctype html><meta charset="utf-8"><body style="background:#000;color:#9f9;font:12px monospace">
<!-- The "1 hour lead" pop-up is a page now (one-hour-lead.html), and it has a
     dust-off button.  Three things have to hold.

     1. The page does what the pop-up did: the cone and the moment arrive in
        the query string, the hour is scanned, and each entry time it reports
        survives an independent cone test written here from the geometry
        rather than taken from the page's own module.
     2. dust-off clears the pure carriers and keeps everything that can see the
        ground or listen to it - military before all else, so DMSP survives a
        pass that clears NOAA and MILSTAR survives one that clears Intelsat.
        The arithmetic has to balance: what the count says was cleared is what
        the note accounts for.
     3. The clear zone below the table is empty until Dust-Off is pressed, and
        once it is, every block it prints is re-counted here: at the middle of
        each block, the number of listed satellites this harness's own cone
        test puts inside the cone has to be the number the block claims, and
        the blocks have to tile the hour end to end with nothing left over.
        The columns are nested - each is "k or fewer", so every window in one
        has to sit inside a window of the next - and nothing under half a
        minute is printed in any of them.
        A clear window that is not clear is the one error the page must not
        make, so it is checked against something other than itself.
     4. Cone-Waffles still works with the geometry lifted out into
        cone-geometry.js, and its link carries the cone it is showing. -->
<pre id="out">running…</pre>
<iframe id="f" style="width:1400px;height:900px;border:0"></iframe>
<iframe id="g" style="width:1200px;height:700px;border:0"></iframe>
<script src="https://unpkg.com/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
const log=[],put=(k,v)=>log.push(k+': '+JSON.stringify(v));
const done=()=>{document.getElementById('out').textContent=log.join('\n');};
try{ sessionStorage.setItem('nazar.spacestuff','1'); }catch(e){}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// A fixed moment, so the roster is the same on every run.
const T=Date.UTC(2026,10,2,12,0,0);
const CONE={lat:28.61,lng:77.21,angle:30,height:2000,tilt:0,dir:0};
const f=document.getElementById('f'),g=document.getElementById('g');
f.src=`../../one-hour-lead.html?lat=${CONE.lat}&lng=${CONE.lng}&angle=${CONE.angle}`+
      `&height=${CONE.height}&tilt=${CONE.tilt}&dir=${CONE.dir}&t=${T}&zone=UTC`;
g.src='../../cone-waffles.html';
window.addEventListener('load',()=>setTimeout(run,3000));

// --- this harness's own cone test, written from the geometry -------------
// Spherical Earth of the radius the pages draw.  A VERTICAL cone of half-angle
// A capped at H holds a satellite when it is above the horizon, no more than H
// along the axis, and no more than A off it.  CONE.tilt is 0, so this is the
// whole test; it shares no code with cone-geometry.js on purpose.
const R=6371, D=Math.PI/180;
function ecef(lat,lon,alt){const a=lat*D,o=lon*D,r=R+alt;
  return [r*Math.cos(a)*Math.cos(o), r*Math.cos(a)*Math.sin(o), r*Math.sin(a)];}
function insideVerticalCone(satLat,satLon,satAlt,c){
  const [ax,ay,az]=ecef(c.lat,c.lng,0), [sx,sy,sz]=ecef(satLat,satLon,satAlt);
  const la=c.lat*D, lo=c.lng*D;
  const up=[Math.cos(la)*Math.cos(lo),Math.cos(la)*Math.sin(lo),Math.sin(la)];
  const v=[sx-ax,sy-ay,sz-az], range=Math.hypot(v[0],v[1],v[2]);
  const axial=v[0]*up[0]+v[1]*up[1]+v[2]*up[2];
  if(axial<=0||axial>c.height) return false;
  return Math.acos(Math.min(1,axial/range))/D<=c.angle;
}
function geoAt(rec,ms){
  const d=new Date(ms), pv=satellite.propagate(rec,d);
  if(!pv||!pv.position) return null;
  const q=satellite.eciToGeodetic(pv.position,satellite.gstime(d));
  return [satellite.degreesLat(q.latitude),satellite.degreesLong(q.longitude),q.height];
}

async function run(){
 try{
  const w=f.contentWindow, d=f.contentDocument;
  // 16k objects over the hour, then every pass for the few hundred found: in a
  // background tab that is minutes, not seconds.
  for(let i=0;i<900 && !(w.__ohl && w.__ohl.ready() && !w.__ohl.scanning());i++) await wait(500);
  const o=w.__ohl;
  put('hook',!!o);
  put('scanFinished',!o.scanning());

  // --- 1. the page does what the pop-up did ----------------------------
  put('coneFromTheUrl',o.cone());
  put('momentHonoured',o.cone().T===T);
  put('found',o.found());
  put('listedEqualsFound',o.listed()===o.found());
  put('tableMatchesTheList',o.rows()===o.listed());
  put('subtitleNamesTheSite',/28\.61. N, 77\.21. E/.test(o.subtitle()));
  put('subtitleFoundTheCountry',/India/.test(o.subtitle()));

  // Every reported entry time, re-derived here: inside at T+entry, and for the
  // ones that were not already inside, outside 90 s earlier.  (The scan refines
  // to the second, so a 90 s margin is clear of its own resolution.)
  const entries=o.entries();
  let inAt=0, outBefore=0, late=0, checked=0, misses=[];
  for(const e of entries){
    const at=geoAt(e.rec,T+e.entry);
    if(!at) continue;
    checked++;
    if(insideVerticalCone(at[0],at[1],at[2],CONE)) inAt++; else misses.push([e.name,e.entry,at]);
    if(e.entry>90000){
      late++;
      const before=geoAt(e.rec,T+e.entry-90000);
      if(before && !insideVerticalCone(before[0],before[1],before[2],CONE)) outBefore++;
    }
  }
  put('insideAtTheReportedEntry',[inAt,checked]);
  put('outsideNinetySecondsEarlier',[outBefore,late]);
  put('entryTimesVerifyIndependently',inAt===checked && outBefore===late);
  put('misses',misses.slice(0,3));

  // The "Goes out" column, the same way: inside 5 s before the instant it
  // names, outside 5 s after, and never before the satellite got in.
  let inBefore=0, outAfter=0, ordered=0, exits=0, stillIn=0, exitMisses=[];
  for(const e of entries){
    if(e.exit<0){ stillIn++; continue; }
    exits++;
    if(e.exit>e.entry) ordered++;
    const a=geoAt(e.rec,T+e.exit-5000), b=geoAt(e.rec,T+e.exit+5000);
    const okIn=a&&insideVerticalCone(a[0],a[1],a[2],CONE);
    const okOut=b&&!insideVerticalCone(b[0],b[1],b[2],CONE);
    if(okIn) inBefore++;
    if(okOut) outAfter++;
    if(!okIn||!okOut) exitMisses.push([e.name,e.entry,e.exit,okIn,okOut]);
  }
  put('everySatelliteHasAnExit',exits+stillIn===entries.length);
  put('stillInsideAfterThreeHours',stillIn);
  put('insideFiveSecondsBeforeTheExit',[inBefore,exits]);
  put('outsideFiveSecondsAfterTheExit',[outAfter,exits]);
  put('exitAlwaysAfterEntry',[ordered,exits]);
  put('exitTimesVerifyIndependently',inBefore===exits && outAfter===exits && ordered===exits);
  put('exitMisses',exitMisses.slice(0,3));

  // the column has to be in the table, next to "Enters in"
  const heads=[...d.querySelectorAll('thead th')].map(h=>h.textContent);
  put('columns',heads);
  put('goesOutSitsNextToEntersIn',heads.indexOf('Goes out')===heads.indexOf('Enters in')+1);
  const cells=[...d.querySelectorAll('tr[data-i]')[0].children].map(c=>c.textContent);
  put('firstRow',cells);
  put('cellsMatchTheHeadings',cells.length===heads.length);

  // --- 2. dust-off -------------------------------------------------------
  put('classifications',['MILSTAR 5','SKYNET 5A','DMSP 5D-3 F18','NOAA 19','INTELSAT 901',
      'STARLINK-1007','ONEWEB-0012','QIANFAN-16','COSMOS 2612','ICEYE-X36','YAOGAN-35 05C',
      'HAWKEYE 360 CLUSTER 7A','TDRS 12','NVS-03 (IRNSS-1L)','HST','SL-16 R/B','OBJECT A']
    .map(n=>[n,o.classify(n).label,o.classify(n).keep]));

  const cls=n=>o.classify(n);
  put('carriersAreCleared',['INTELSAT 901','STARLINK-1007','ONEWEB-0012','NOAA 19','GOES 18','SL-16 R/B']
    .every(n=>!cls(n).keep));
  put('militaryCommsAreKept',['MILSTAR 5','SKYNET 5A','WGS-10','MUOS-5','RADUGA-1M 3']
    .every(n=>cls(n).keep));
  put('militaryWeatherIsKept',cls('DMSP 5D-3 F18').keep && !cls('NOAA 19').keep);
  put('sensorsAreKept',['COSMOS 2612','YAOGAN-35 05C','ICEYE-X36','CAPELLA-14','LANDSAT 9',
    'HAWKEYE 360 CLUSTER 7A','TDRS 12'].every(n=>cls(n).keep));
  put('unknownIsKept',cls('OBJECT A').keep && cls('2022-023F').keep);

  put('buttonReadsDustOff',o.dustLabel());
  put('nothingIsExplainedUntilItIsPressed',o.note()==='');
  put('clearZoneIsIdle',[o.zoneLede(),o.zoneRows().length,o.zoneHeads().length]);
  put('clearZoneWaitsForTheButton',/Dust-Off/.test(o.zoneLede()) && o.zoneRows().length===0);

  const before=o.listed(), scaleBefore=o.cone().dmax;
  o.toggleDust();
  await wait(900);
  put('dusted',o.dusted());
  const after=o.listed();
  put('listedBeforeAndAfter',[before,after]);
  put('somethingWasCleared',after<before);
  put('tableFollowedTheList',o.rows()===after);
  put('nothingKeptWasCleared',o.listedNames().length===after);
  put('everySurvivorIsAKeeper',o.purposes().filter(p=>!p[2]).length===before-after);

  // the note has to account for every satellite the count says went
  const cleared=before-after;
  const noteTotal=(o.note().match(/ (\d+)/g)||[]).map(Number).reduce((a,b)=>a+b,0);
  put('countSaysCleared',cleared);
  put('noteAccountsForThem',noteTotal===cleared);
  put('noteSaysItIsByName',/catalogue name/i.test(o.note()));
  put('note',o.note());
  put('count',o.count());

  // pressing the button must not move the plot under the reader
  put('plotScaleUnchanged',o.cone().dmax===scaleBefore);

  // --- 3. the clear zone -------------------------------------------------
  put('buttonReadsBringThemBack',o.dustLabel());
  const W=o.window(), blocks=o.blocks();
  put('windowIsTheHour',W===3600000);
  put('blockCount',blocks.length);

  // the blocks have to tile [0, W] end to end: no gap, no overlap, nothing
  // left over, and no two neighbours carrying the same count
  let tiles=blocks.length>0 && blocks[0].from===0 && blocks[blocks.length-1].to===W;
  let merged=true, totals=0;
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    if(b.to<=b.from) tiles=false;
    if(i && blocks[i-1].to!==b.from) tiles=false;
    if(i && blocks[i-1].n===b.n) merged=false;
    totals+=b.to-b.from;
  }
  put('blocksTileTheHour',tiles);
  put('blocksSumToTheHour',[totals,W,totals===W]);
  put('neighbouringBlocksDiffer',merged);

  // every block's count, re-derived: at the middle of the block, how many of
  // the listed satellites does THIS harness put inside the cone?
  const listed=o.passes();
  put('passesCoverTheListedSatellites',listed.length===after);
  const countAt=t=>{ let n=0;
    for(const e of listed){ const g=geoAt(e.rec,t);
      if(g && insideVerticalCone(g[0],g[1],g[2],CONE)) n++; }
    return n; };
  let agree=0, real=0, mism=[], shortMism=0;
  for(const b of blocks){
    const n=countAt(T+(b.from+b.to)/2), long=b.to-b.from>=2000;
    if(long) real++;
    if(n===b.n){ if(long) agree++; }
    else if(long) mism.push([b.from,b.to,b.to-b.from,b.n,n]);
    else shortMism++;
  }
  // Blocks shorter than two seconds are left out of the assertion: the page
  // bisects each boundary to a tenth of a second, so on a block of that order
  // the midpoint can fall the other side of one.  They are counted, not hidden.
  put('blockCountsVerifyIndependently',[agree,real]);
  put('blockMismatches',mism.slice(0,6));
  put('subSecondBlocksSkipped',[shortMism,blocks.length-real]);

  // The clear windows are the answer the page exists for, so they are not
  // sampled once in the middle but swept: at every second of every one of
  // them, nothing on the list may be inside the cone.
  let swept=0, intruders=[];
  for(const b of o.windows(0)){
    for(let t=b.from+250; t<b.to; t+=1000){
      swept++;
      const n=countAt(T+Math.min(t,b.to-250));
      if(n) intruders.push([b.from,b.to,Math.round(t),n]);
    }
  }
  put('clearWindowsSweptSecondBySecond',swept);
  put('nothingIsInsideAClearWindow',intruders.length===0);
  put('intruders',intruders.slice(0,6));

  // --- the columns the reader actually sees --------------------------
  const K=[0,1,2,3,4,5], MIN=o.minWindow(), win=K.map(k=>o.windows(k));
  put('minimumWindow',MIN);
  put('windowsPerColumn',win.map(w=>w.length));

  // nothing short is printed, and no window runs backwards
  put('everyWindowReachesTheMinimum',win.every(w=>w.every(x=>x.to-x.from>=MIN && x.to>x.from)));

  // "k or fewer": every window of one column has to sit inside a window of
  // the next, and the next can only be longer in total
  const inside=(x,w)=>w.some(y=>y.from<=x.from && y.to>=x.to);
  put('columnsAreNested',K.slice(1).every(k=>win[k-1].every(x=>inside(x,win[k]))));
  const tot=w=>w.reduce((a,x)=>a+(x.to-x.from),0);
  put('totalsPerColumn',win.map(w=>Math.round(tot(w)/1000)));
  put('totalsOnlyGrowRightwards',K.slice(1).every(k=>tot(win[k])>=tot(win[k-1])));

  // a window is a run of blocks at or under its threshold, and the block
  // either side of it must be over that threshold (or the hour must end)
  let edges=0, bad=[];
  for(const k of K) for(const x of win[k]){
    const before=blocks.filter(b=>b.to<=x.from).pop(), after=blocks.find(b=>b.from>=x.to);
    const okIn=blocks.filter(b=>b.from>=x.from && b.to<=x.to).every(b=>b.n<=k);
    const okOut=(!before||before.n>k) && (!after||after.n>k);
    if(okIn&&okOut) edges++; else bad.push([k,x.from,x.to,okIn,okOut]);
  }
  put('windowsAreMaximalRuns',[edges,win.reduce((a,w)=>a+w.length,0)]);
  put('badWindows',bad.slice(0,6));

  put('clearWindows',win[0].length);
  put('clearSeconds',Math.round(tot(win[0])/1000));
  put('ledeAgreesWithTheWindows',
    win[0].length ? /Clear for/.test(o.zoneLede()) : /No clear window/.test(o.zoneLede()));
  put('ledeSaysTheColumnsAreCumulative',/that many or fewer/.test(o.zoneLede()));
  put('ledeNamesTheFloor',/0 m 30 s|30 s/.test(o.zoneLede()));
  put('lede',o.zoneLede());

  const zheads=o.zoneHeads(), zrows=o.zoneRows();
  put('zoneColumns',zheads);
  put('sixColumnsUpToFiveOrFewer',
    zheads.length===6 && /none in the cone/.test(zheads[0]) && /5 or fewer/.test(zheads[5]));
  const filled=k=>zrows.filter(r=>r[k]!=='').length;
  put('eachColumnListsItsOwnWindows',K.map(k=>[filled(k),win[k].length]));
  put('columnsMatchTheWindows',K.every(k=>filled(k)===win[k].length));
  put('rowsAreAsLongAsTheLongestColumn',zrows.length===Math.max(...win.map(w=>w.length)));
  put('foot',o.zoneFoot());
  put('firstRow0',zrows.length?zrows[0][0]:'');

  o.toggleDust();
  await wait(900);
  put('bringsThemBack',[o.dusted()===false,o.listed()===before,o.rows()===before]);
  put('clearZoneEmptiesAgain',[o.zoneRows().length===0,/Dust-Off/.test(o.zoneLede()),o.dustLabel()]);

  // the cone is still editable on the page itself
  await o.setCone({angle:12});
  for(let i=0;i<120 && o.scanning();i++) await wait(500);
  put('rescanWithANarrowerCone',[o.cone().angle,o.found()]);
  put('narrowerConeSeesFewer',o.found()<before);

  // --- 4. Cone-Waffles after the extraction ------------------------------
  const cw=g.contentWindow, cwd=g.contentDocument;
  for(let i=0;i<60 && !/Catalogue:/.test(cwd.getElementById('cw-status').textContent);i++) await wait(500);
  put('coneWafflesStatus',cwd.getElementById('cw-status').textContent);
  put('coneWafflesSharesTheGeometry',!!cw.ConeGeom);
  put('coneWafflesStillListsHits',cwd.getElementById('land-count').textContent);
  const a=cwd.getElementById('t-lead');
  put('leadIsALinkNow',a&&a.tagName);
  put('popUpMarkupIsGone',!cwd.getElementById('lead'));
  const href=a&&a.getAttribute('href');
  put('linkCarriesTheCone',href);
  const q=new URLSearchParams((href||'').split('?')[1]||'');
  put('linkMatchesThePanel',[
    q.get('lat')===cwd.getElementById('land-lat').value,
    q.get('lng')===cwd.getElementById('land-lng').value,
    q.get('angle')===cwd.getElementById('land-angle').value,
    q.get('height')===cwd.getElementById('land-height').value,
    Math.abs(Date.now()-(+q.get('t')))<5000]);

  // move the cone and the link must follow it
  const latEl=cwd.getElementById('land-lat');
  latEl.value='35.00';
  latEl.dispatchEvent(new Event('input'));
  await wait(400);
  put('linkFollowsTheCone',new URLSearchParams(a.getAttribute('href').split('?')[1]).get('lat')==='35.00');
 }catch(e){ put('ERROR',e.message+' @ '+(e.stack||'').split('\n')[1]); }
 done();
}
</script>
