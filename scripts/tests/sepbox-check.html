<!doctype html><meta charset="utf-8"><body style="background:#000;color:#9f9;font:12px monospace">
<!-- Drives the Dog-Fights separation cuboid: that it is a green translucent
     box, that its three drawn edges are the along-track / vertical /
     cross-track split, that those square back to the slant range, that the
     two satellites really do sit on opposite corners, and that the box rides
     along with them while the clock runs. -->
<pre id="out">running…</pre><iframe id="f" style="width:1400px;height:880px;border:0"></iframe>
<script>
const log=[],put=(k,v)=>log.push(k+': '+JSON.stringify(v));
const done=()=>{document.getElementById('out').textContent=log.join('\n');};
try{ sessionStorage.setItem('nazar.spacestuff','1'); }catch(e){}
const f=document.getElementById('f');
f.src='../../dogfights.html';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load',()=>setTimeout(run,11000));

async function run(){
 try{
  const d=f.contentDocument,w=f.contentWindow,df=w.__df;
  put('hook',!!df);
  const q=d.getElementById('df-q');
  for(const name of ['iss','tjs-3']){
    q.value=name; q.dispatchEvent(new Event('input')); await wait(250);
    d.getElementById('df-add').click(); await wait(250);
  }
  put('picked',df.picked());
  put('boxOffBeforeAnyPick',df.sep());

  d.getElementById('df-sep-on').click(); await wait(600);
  const s=df.sep();
  put('boxOn',!!s);
  put('readout',s);
  put('rowsShown',[...d.querySelectorAll('.df-sep .row b')].map(e=>e.textContent));

  // it must be a cuboid, translucent and green
  const g=w.__df.boxInfo?w.__df.boxInfo():null;
  put('boxInfo',g);

  // the three readouts must square back to the slant range
  const near=(a,b,tol)=>Math.abs(a-b)<=tol;
  const sum=Math.hypot(s.vertical,s.alongTrack,s.crossTrack);
  put('threeEdgesGiveTheRange',[+sum.toFixed(1),s.range,near(sum,s.range,0.4)]);
  // and horizontal must be the two horizontal edges together
  const hor=Math.hypot(s.alongTrack,s.crossTrack);
  put('horizontalIsTheTwoFlatEdges',[+hor.toFixed(1),s.horizontal,near(hor,s.horizontal,0.3)]);
  // the drawn cuboid's own edges must be those same three numbers
  put('drawnEdgesMatchTheNumbers',
      [s.boxEdgesKm,[s.alongTrack,s.vertical,s.crossTrack],
       s.boxEdgesKm&&near(s.boxEdgesKm[0],s.alongTrack,1)&&near(s.boxEdgesKm[1],s.vertical,1)
        &&near(s.boxEdgesKm[2],s.crossTrack,1)]);

  // independent recomputation
  const chk=df.sepCheck();
  put('independentCheck',chk);
  put('agrees',chk&&near(chk.range,s.range,0.2)&&near(chk.vertical,s.vertical,0.2)
      &&near(chk.horizontal,s.horizontal,0.2));

  // satellites on opposite corners of the drawn box
  put('satellitesOnOppositeCorners',df.cornerCheck?df.cornerCheck():null);

  // it has to ride along with them under the clock
  const before=df.sep();
  for(let i=0;i<40;i++) df.step(30);
  await wait(300);
  const after=df.sep();
  put('movesWithTheClock',[before.range,after.range,before.range!==after.range]);
  put('stillOnTheCornersAfterStepping',df.cornerCheck?df.cornerCheck():null);
  put('stillVisible',after.boxVisible);

  d.getElementById('df-sep-on').click(); await wait(300);
  put('offAgain',[df.sep(),d.getElementById('df-sep-out').hidden]);
 }catch(e){ put('ERROR',e.message); }
 done();
}
</script>
